<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!--
    The TAWD mark: three white bars ascending left to right — a mountain's steps
    (طود), a rising chart, full signal.

    All three bars are #ffffff, exactly as TawdLogoMark draws them. The accent
    colour belongs to the interface, never to the identity: the logo is not a
    place to show off the palette, and a mark that changes colour with the theme
    stops being a mark. Two of these were blue until it was pointed out — the
    same mistake as tinting the sidebar logo, made a second time.

    Drawn for 16 pixels rather than scaled down from the app logo: thicker bars,
    a gentler lean, and no glow, because all three vanish at tab size and only
    cost contrast against the neighbouring tabs.
  -->
  <rect width="32" height="32" rx="8" fill="#0a0a09"/>
  <g transform="skewY(-8) translate(0 2.4)">
    <rect x="5"  y="17" width="6" height="9"  rx="1.8" fill="#ffffff"/>
    <rect x="13" y="13" width="6" height="13" rx="1.8" fill="#ffffff"/>
    <rect x="21" y="8"  width="6" height="18" rx="1.8" fill="#ffffff"/>
  </g>
</svg>
